[project]
name = "ro-utils"
version = "0.5.0"
description = "utils for daily usage"
authors = [{ name = "rogerogers", email = "rogers@rogerogers.com" }]
requires-python = ">=3.10"
readme = "readme.md"

[project.urls]
Homepage = "https://github.com/rogerogers/python-ro-utils"
Repository = "https://github.com/rogerogers/python-ro-utils"
Issues = "https://github.com/rogerogers/python-ro-utils/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
